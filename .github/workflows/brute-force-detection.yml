name: Brute force detection checks
on:
  push:
    paths: ['projects/brute-force-detection/**', '.github/workflows/brute-force-detection.yml']
  pull_request:
    paths: ['projects/brute-force-detection/**', '.github/workflows/brute-force-detection.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/brute-force-detection
    strategy:
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce lab results
        run: python -m bruteforce --input data/auth.log --output reports/local --label "Synthetic SSH lab"
